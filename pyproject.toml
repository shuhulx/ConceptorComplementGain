[tool.ruff]
line-length = 100
target-version = "py312"
# Maintained helpers and tests.
include = [
    "conceptor_tools.py",
    "activation_steer.py",
    "extract_activations.py",
    "eval/*.py",
    "scripts/*.py",
    "tests/*.py",
    "examples/*.py",
    "experiments/**/*.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Selected lint rules apply repository-wide; study scripts have local style exceptions.
[tool.ruff.lint.per-file-ignores]
"experiments/broad_study/run_study.py" = ["E401", "E402", "E701", "E702", "E741", "I001"]
"experiments/erasure/source/runner.py" = ["E702", "E731", "I001"]
"experiments/erasure/source/test_erasure_runner.py" = ["E401", "E702", "I001"]
"experiments/protocol_swap/source/runner.py" = ["I001"]
"experiments/spectral_screening/source/formula_screening.py" = ["E712"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "experiments/erasure/source",
    "experiments/spectral_screening/source/test_spectral_metrics.py",
    "experiments/aperture/source",
    "experiments/corrected_coherence/source",
    "experiments/paired_geometry/source",
    "experiments/finite_alternatives/source",
]
python_files = ["test_*.py", "*_test.py"]
